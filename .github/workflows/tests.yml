name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t ventasgg-sales-bot:ci .
      - name: Arranca y responde /health
        run: |
          docker run -d --name bot -e APP_ENV=development -e WORKER_ENABLED=false -p 8003:8003 ventasgg-sales-bot:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8003/health && exit 0; sleep 2; done
          docker logs bot; exit 1
